<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <!-- FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  >


  <!-- ICONS -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.css"
  >


  <style>


    /* PAGE SETTINGS */

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family: "Jost", sans-serif;

      background-color: #FAF9F2;

    }



    /* Main */

    .container {

      width: 92%;

      max-width: 1700px;

      margin: 25px auto;

      display: flex;

      flex-direction: row;

      align-items: flex-start;

      justify-content: center;

      gap: clamp(20px, 5vw, 90px);

    }



    /* NATURE IMG */

    section {

      flex: 0 1 32%;

      width: 32%;

      min-width: 0;

      aspect-ratio: 0.73 / 1;

      border-radius:
        clamp(50px, 10vw, 160px)
        0
        0
        0;

      background-image:
        url('https://i.pinimg.com/736x/9b/94/b3/9b94b30400bc3ac76af3a08424ab9bb9.jpg');

      background-size: cover;

      background-position: center;

      background-repeat: no-repeat;

    }



     /* TEXT */

    aside {

      flex: 1 1 0;

      min-width: 0;

      position: relative;

      margin: 0;

      padding:

        clamp(25px, 4vw, 60px)

        clamp(18px, 4vw, 65px)

        clamp(25px, 3vw, 50px);


      background-color: #DCC5A5;

      border: 4.5px solid #81A430;

      border-radius:
        clamp(20px, 2vw, 35px);

      box-shadow:
        0px 8px 16px rgba(0, 0, 0, 0.15);

      overflow: hidden;

    }



    /* ICON */

    .icon-bar {

      position: absolute;

      top: clamp(10px, 2vw, 25px);

      right: clamp(10px, 2vw, 25px);

      display: flex;

      flex-direction: row-reverse;

      gap: clamp(5px, 1vw, 15px);

    }


    .icon-bar a {

      color: white;

      text-decoration: none;

      font-size:
        clamp(1.1rem, 2.5vw, 3rem);

      line-height: 1;

    }


    .fa-envelope:hover,
    .fa-linkedin:hover {

      color: #CDE8D5;

    }



     /* TITLE */

    .intro-title {

      margin: 0;

      padding: 0;

      /* Prevent title from hitting icons */

      padding-right: 70px;


      text-align: left;


      /* Larger on computers */

      font-size:
        clamp(1.3rem, 3.2vw, 3.2rem);


      line-height: 1.1;

      font-weight: 700;


      text-decoration: underline;

      text-decoration-color: white;

      text-underline-offset:
        clamp(4px, 0.5vw, 8px);


      overflow-wrap: break-word;

    }


   /* MAIN PARAGRAPH */

    .intro-text {

      margin:

        clamp(30px, 5vw, 70px)

        auto

        0;


      max-width: 100%;


      text-align: center;


      /* Larger on computers */

      font-size:
        clamp(0.7rem, 2vw, 2.2rem);


      line-height: 1.5;


      font-weight: 600;


      /* Keeps text inside */

      overflow-wrap: anywhere;

      word-break: normal;

    }


    .intro-text span {

      color: #51750B;

    }



       /* PHONE */

    @media (max-width: 500px) {


      .container {

        width: 96%;

        gap: 12px;

        align-items: flex-start;

      }



      /* IMAGE */

      section {

        flex-basis: 32%;

        width: 32%;

        border-radius:

          50px

          0

          0

          0;

      }



      /* TEXT BOX */

      aside {

        padding:

          18px

          12px

          20px;


        border-width: 3px;

        border-radius: 18px;

      }



      /* ICONS */

      .icon-bar {

        top: 8px;

        right: 8px;

        gap: 3px;

      }


      .icon-bar a {

        font-size:

          clamp(0.9rem, 6vw, 1.4rem);

      }



      /* TITLE */

      .intro-title {

        padding-right: 45px;


        font-size:

          clamp(1rem, 6vw, 1.5rem);

      }



      /* TEXT */

      .intro-text {

        margin-top:

          clamp(18px, 6vw, 35px);


        font-size:

          clamp(0.62rem, 3vw, 0.9rem);


        line-height: 1.45;

        padding: 0;

      }

    }


  </style>


</head>



<body>


  <div class="container">


    <!-- FLOWER IMAGE -->

    <section></section>



    <!-- TEXT BOX -->

    <aside>


      <!-- ICONS -->

      <div class="icon-bar">


        <a href="https://www.linkedin.com/in/amicie-koslow-928b3b255">

          <i class="fa fa-linkedin"></i>

        </a>


        <a href="mailto:ackoslow@gmail.com">

          <i class="fa fa-envelope"></i>

        </a>


      </div>



      <!-- TITLE -->

      <h1 class="intro-title">

        test

      </h1>



      <!-- TEXT -->

      <p class="intro-text">


        Salut! I'm a

        <span>Cognitive Science</span>

        Major &

        <span>Consumer Psych</span>

        Minor at UPenn.


        I'm passionate about User Research,

        specifically GUR.


      </p>


    </aside>


  </div>


</body>


</html>
